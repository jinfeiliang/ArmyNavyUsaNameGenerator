<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Name Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 40px;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      .checkbox-group {
        margin-top: 10px;
      }

      .checkbox-group label {
        font-weight: normal;
        display: inline-block;
        margin-right: 15px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button.secondary {
        background: #28a745;
      }

      button:hover {
        opacity: 0.9;
      }

      .output {
        margin-top: 25px;
        padding: 15px;
        background: #eef3ff;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
        word-break: break-word;
      }

      .copied {
        margin-top: 10px;
        text-align: center;
        color: #28a745;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Product Name Generator</h1>

      <label>Brand</label>
      <select id="brand">
        <option>Timberland Pro</option>
        <option>Muck</option>
        <option>Durango</option>
      </select>

      <label>Series (type or choose)</label>
      <input
        list="seriesList"
        id="series"
        placeholder="Enter or select series"
      />
      <datalist id="seriesList">
        <option>ACCESSORY</option>
        <option>ALPHA PURSUIT</option>
        <option>APEX</option>
        <option>APEX PRO</option>
        <option>ARCTIC ADVENTURE</option>
        <option>ARCTIC APRES</option>
        <option>ARCTIC GRIP</option>
        <option>ARCTIC PRO</option>
        <option>ARCTIC SPORT</option>
        <option>ARCTIC SPORT II</option>
        <option>ARCTIC WEEKEND</option>
        <option>CALDER</option>
        <option>CHORE</option>
        <option>CHORE CLASSIC</option>
        <option>CHORE COOL</option>
        <option>CHORE FARM LEATHER</option>
        <option>CHORE MAX</option>
        <option>DERBY</option>
        <option>EDGEWATER</option>
        <option>ELEMENT</option>
        <option>EXCURSION</option>
        <option>FIELDBLAZER</option>
        <option>FORAGER</option>
        <option>HALE</option>
        <option>HARVESTER</option>
        <option>LEATHER ORIGINALS</option>
        <option>LIBERTY</option>
        <option>MINI MUCK</option>
        <option>MUCK APPAREL</option>
        <option>PATHFINDER</option>
        <option>MUCKMASTER</option>
        <option>MUCKSTER II</option>
        <option>MUCKSTER LITE</option>
        <option>MUDDER</option>
        <option>MY FIRST MUCK</option>
        <option>ORIGINALS</option>
        <option>OUTPOST</option>
        <option>OUTSCAPE</option>
        <option>OUTSCAPE MAX</option>
        <option>RAINSCAPE</option>
        <option>ROVER II</option>
        <option>RUGGED II</option>
        <option>WETLAND</option>
        <option>WOODY</option>
      </datalist>

      <label>Descriptor (optional)</label>
      <input
        type="text"
        id="descriptor"
        placeholder="e.g. Athletic, BOA True Grit"
      />

      <div class="checkbox-group">
        <label><input type="checkbox" id="ev" /> EV</label>
        <label><input type="checkbox" id="pullOn" /> Pull-On</label>
        <label><input type="checkbox" id="waterproof" /> Waterproof</label>
      </div>

      <label>Toe Type</label>
      <select id="toeType">
        <option value="">None</option>
        <option>Composite Toe</option>
        <option>Steel Toe</option>
        <option>Soft Toe</option>
        <option>Alloy Toe</option>
      </select>

      <label>Category</label>
      <select id="category">
        <option>Boot</option>
        <option>Work Boot</option>
        <option>Work Sneaker</option>
        <option>Work Shoe</option>
        <option>Oxford</option>
      </select>

      <label>Product Code</label>
      <input type="text" id="code" placeholder="Enter product code" />

      <div class="actions">
        <button onclick="generateName()">Generate</button>
        <button class="secondary" onclick="copyToClipboard()">Copy</button>
      </div>

      <div class="output" id="output">Your product name will appear here</div>
      <div class="copied" id="copiedMsg">Copied to clipboard ✓</div>
    </div>

    <script>
      function autoCapitalize(text) {
        return text
          .toLowerCase()
          .split(" ")
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");
      }

      function buildName() {
        const brand = document.getElementById("brand").value;
        const seriesRaw = document.getElementById("series").value.trim();
        const descriptorRaw = document
          .getElementById("descriptor")
          .value.trim();
        const ev = document.getElementById("ev").checked;
        const pullOn = document.getElementById("pullOn").checked;
        const waterproof = document.getElementById("waterproof").checked;
        const toeType = document.getElementById("toeType").value;
        const category = document.getElementById("category").value;
        const code = document.getElementById("code").value.trim().toUpperCase();

        const series = autoCapitalize(seriesRaw);
        const descriptor = autoCapitalize(descriptorRaw);

        let parts = [];

        if (brand) parts.push(brand);
        if (series) parts.push(series);
        if (ev) parts.push("EV");
        if (descriptor) parts.push(descriptor);
        if (pullOn) parts.push("Pull-On");
        if (waterproof) parts.push("Waterproof");
        if (toeType) parts.push(toeType);
        if (category) parts.push(category);
        if (code) parts.push(code);

        return parts.join(" ").replace(/\s+/g, " ").trim();
      }

      function generateName() {
        const result = buildName();
        document.getElementById("output").innerText =
          result || "Please fill required fields";
      }

      function copyToClipboard() {
        const text = document.getElementById("output").innerText;
        if (!text || text === "Your product name will appear here") return;

        navigator.clipboard.writeText(text).then(() => {
          const msg = document.getElementById("copiedMsg");
          msg.style.display = "block";
          setTimeout(() => (msg.style.display = "none"), 1500);
        });
      }

      // Live preview
      const inputs = document.querySelectorAll("input, select");
      inputs.forEach((el) => {
        el.addEventListener("input", generateName);
        el.addEventListener("change", generateName);
      });
    </script>
  </body>
</html>
