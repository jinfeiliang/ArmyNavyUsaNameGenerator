<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Product Name Generator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 40px;
      }

      .container {
        max-width: 700px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      .checkbox-group {
        margin-top: 10px;
      }

      .checkbox-group label {
        font-weight: normal;
        display: inline-block;
        margin-right: 15px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button.secondary {
        background: #28a745;
      }

      button.reset {
        background: #6c757d;
      }

      button:hover {
        opacity: 0.9;
      }

      .output {
        margin-top: 25px;
        padding: 15px;
        background: #eef3ff;
        border-radius: 10px;
        font-weight: bold;
        text-align: center;
        word-break: break-word;
      }

      .copied {
        margin-top: 10px;
        text-align: center;
        color: #28a745;
        font-size: 14px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Product Name Generator</h1>

      <label>Brand</label>
      <select id="brand"></select>

      <label>Series (type or choose)</label>
      <input
        list="seriesList"
        id="series"
        placeholder="Enter or select series"
      />
      <datalist id="seriesList"></datalist>

      <label>Descriptor (optional)</label>
      <input
        type="text"
        id="descriptor"
        placeholder="e.g. ATHLETIC, BOA TRUE GRIT"
      />

      <label>Size (inches)</label>
      <input type="number" id="sizeInches" placeholder="e.g. 12" />

      <div class="checkbox-group" id="featuresBox"></div>

      <label>Toe Type</label>
      <select id="toeType"></select>

      <label>Category</label>
      <select id="category"></select>

      <label>Product Code</label>
      <input type="text" id="code" placeholder="Enter product code" />

      <div class="actions">
        <button onclick="generateName()">Generate</button>
        <button class="secondary" onclick="copyToClipboard()">Copy</button>
        <button class="reset" onclick="resetExceptBrand()">Reset</button>
      </div>

      <div class="output" id="output">Your product name will appear here</div>
      <div class="copied" id="copiedMsg">Copied to clipboard ✓</div>
    </div>

    <script>
      const brands = ["Timberland Pro", "Muck", "Durango"];

      const toeTypes = [
        "",
        "Composite Toe",
        "Steel Toe",
        "Soft Toe",
        "Alloy Toe",
      ];

      const categories = [
        "Boot",
        "Work Boot",
        "Work Sneaker",
        "Work Shoe",
        "Oxford",
        "Ankle Boot",
        "Mid Boot",
        "Tall Boot",
        "Max Boot",
      ];

      const features = ["EV", "Pull-On", "Waterproof"];

      const seriesByBrand = {
        Muck: [
          "Accessory",
          "Alpha Pursuit",
          "Apex",
          "Apex Pro",
          "Arctic Adventure",
          "Arctic Apres",
          "Arctic Grip",
          "Arctic Pro",
          "Arctic Sport",
          "Arctic Sport II",
          "Arctic Weekend",
          "Calder",
          "Chore",
          "Chore Classic",
          "Chore Cool",
          "Chore Farm Leather",
          "Chore Max",
          "Derby",
          "Edgewater",
          "Element",
          "Excursion",
          "Fieldblazer",
          "Forager",
          "Hale",
          "Harvester",
          "Leather Originals",
          "Liberty",
          "Mini Muck",
          "Muck Apparel",
          "Pathfinder",
          "Muckmaster",
          "Muckster II",
          "Muckster Lite",
          "Mudder",
          "My First Muck",
          "Originals",
          "Outpost",
          "Outscape",
          "Outscape Max",
          "Rainscape",
          "Rover II",
          "Rugged II",
          "Wetland",
          "Woody",
        ],
      };

      function populateSelect(id, arr) {
        const el = document.getElementById(id);
        el.innerHTML = arr.map((v) => `<option>${v}</option>`).join("");
      }

      function populateFeatures() {
        const box = document.getElementById("featuresBox");
        box.innerHTML = features
          .map((f) => {
            const key = f.replace(/\s+/g, "_");
            return `<label><input type=\"checkbox\" id=\"feat_${key}\"> ${f}</label>`;
          })
          .join(" ");
      }

      function populateSeries(brand) {
        const list = document.getElementById("seriesList");
        const data = seriesByBrand[brand] || [];
        list.innerHTML = data
          .map((v) => `<option value=\"${v}\"></option>`)
          .join("");
      }

      function autoCapitalize(text) {
        return text
          .split(" ")
          .map((w) => {
            if (!w) return "";
            if (w === "II") return "II";
            return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
          })
          .join(" ");
      }

      function buildName() {
        const brand = document.getElementById("brand").value;
        const series = document.getElementById("series").value.trim();
        const descriptor = document.getElementById("descriptor").value.trim();
        const size = document.getElementById("sizeInches").value.trim();
        const toeType = document.getElementById("toeType").value;
        const category = document.getElementById("category").value;
        const code = document.getElementById("code").value.trim().toUpperCase();

        let parts = [];
        if (brand) parts.push(brand);
        if (series) parts.push(series);

        features.forEach((f) => {
          const key = f.replace(/\s+/g, "_");
          const el = document.getElementById("feat_" + key);
          if (el && el.checked) parts.push(f);
        });

        if (descriptor) parts.push(descriptor);
        if (size !== "") parts.push(`${size} Inch`);
        if (toeType) parts.push(toeType);
        if (category) parts.push(category);
        if (code) parts.push(code);

        return parts.join(" ").replace(/\s+/g, " ").trim();
      }

      function generateName() {
        document.getElementById("output").innerText =
          buildName() || "Please fill required fields";
      }

      function copyToClipboard() {
        const text = document.getElementById("output").innerText;
        if (!text) return;
        navigator.clipboard.writeText(text).then(() => {
          const msg = document.getElementById("copiedMsg");
          msg.style.display = "block";
          setTimeout(() => (msg.style.display = "none"), 1500);
        });
      }

      function resetExceptBrand() {
        document.getElementById("series").value = "";
        document.getElementById("descriptor").value = "";
        document.getElementById("sizeInches").value = "";
        document.getElementById("toeType").value = "";
        document.getElementById("category").value = "Boot";
        document.getElementById("code").value = "";

        features.forEach((f) => {
          const key = f.replace(/\s+/g, "_");
          const el = document.getElementById("feat_" + key);
          if (el) el.checked = false;
        });

        generateName();
      }

      function init() {
        populateSelect("brand", brands);
        populateSelect("toeType", toeTypes);
        populateSelect("category", categories);
        populateFeatures();

        const brandEl = document.getElementById("brand");
        brandEl.addEventListener("change", () => populateSeries(brandEl.value));

        populateSeries(brandEl.value);
      }

      document.addEventListener("input", generateName);
      document.addEventListener("change", generateName);

      init();
    </script>
  </body>
</html>
